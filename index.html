<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #000000;
        --muted: #666666;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 0.08em;
      }

      .container {
        text-align: center;
        border: 2px solid var(--fg);
        padding: 3rem 4rem;
        background: #fff;
        min-width: min(90vw, 620px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 5rem);
        font-weight: 700;
        text-transform: uppercase;
      }

      .countdown {
        display: flex;
        justify-content: center;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 2rem;
      }

      .time-box {
        min-width: 86px;
        padding: 1rem 0.75rem;
        border: 2px solid var(--fg);
        background: #fff;
      }

      .value {
        display: block;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 700;
        line-height: 1;
      }

      .label {
        display: block;
        margin-top: 0.5rem;
        font-size: 0.7rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }

      p {
        margin-top: 1rem;
        font-size: clamp(0.8rem, 2vw, 1.2rem);
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.2em;
      }

      /* Corner links (right) */
      .corner {
        position: fixed;
        top: 1rem;
        right: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-end;
        z-index: 1000;
      }

      .corner a {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.5rem;
        border: 2px solid var(--fg);
        background: #fff;
        color: var(--fg);
        text-decoration: none;
        font-size: 0.85rem;
        border-radius: 6px;
      }

      .corner img.avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: block;
      }

      .repo-list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      /* Left corner links (GitHub Pages) */
      .corner-left {
        position: fixed;
        top: 1rem;
        left: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
        z-index: 1000;
      }

      .corner-left a,
      .corner-left .profile-button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.5rem;
        border: 2px solid var(--fg);
        background: #fff;
        color: var(--fg);
        text-decoration: none;
        font-size: 0.85rem;
        border-radius: 6px;
      }

      .corner-left .avatar-placeholder {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--muted);
        color: var(--bg);
        font-weight: 700;
        font-size: 0.7rem;
      }

      .pages-list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .pages-title {
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--fg);
        margin-bottom: 0.25rem;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <h1>Coming Soon</h1>
      <div class="countdown" aria-label="Countdown to 15 November">
        <div class="time-box">
          <span id="days" class="value">0</span>
          <span class="label">Days</span>
        </div>
        <div class="time-box">
          <span id="hours" class="value">0</span>
          <span class="label">Hours</span>
        </div>
        <div class="time-box">
          <span id="minutes" class="value">0</span>
          <span class="label">Minutes</span>
        </div>
        <div class="time-box">
          <span id="seconds" class="value">0</span>
          <span class="label">Seconds</span>
        </div>
      </div>
      <p></p>
    </div>

  

    


    <!-- Corner links to profile and public repos (right) -->
    <div class="corner" aria-hidden="false">
      <a href="https://github.com/rrumeerd-sirk" title="View my GitHub profile" target="_blank" rel="noopener noreferrer">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/290811326?v=4" alt="rrumeerd-sirk avatar">
        <span>rrumeerd-sirk</span>
      </a>

      <nav class="repo-list" aria-label="Public repositories">
        <a href="https://github.com/rrumeerd-sirk/ah-site" target="_blank" rel="noopener noreferrer">ah-site</a>
        <a href="https://github.com/rrumeerd-sirk/for-fun" target="_blank" rel="noopener noreferrer">for-fun</a>
        <a href="https://github.com/rrumeerd-sirk/games" target="_blank" rel="noopener noreferrer">games</a>
        <a href="https://github.com/rrumeerd-sirk/linux_rune" target="_blank" rel="noopener noreferrer">linux_rune</a>
        <a href="https://github.com/rrumeerd-sirk/undertale" target="_blank" rel="noopener noreferrer">undertale</a>
        <a href="" target="_blank" rel="noopener noreferrer">----------</a>
        <a href="https://rrumeerd-sirk.github.io/ah-site/" target="_blank" rel="noopener noreferrer">ah-site-site</a>
        <a href="https://rrumeerd-sirk.github.io/for-fun/" target="_blank" rel="noopener noreferrer">for-fun-site</a>
        <a href="https://rrumeerd-sirk.github.io/games/" target="_blank" rel="noopener noreferrer">games-site</a>
        <a href="https://rrumeerd-sirk.github.io/undertale/" target="_blank" rel="noopener noreferrer">undertale-site</a>
      </nav>
    </div>

    <script>
      const targetDate = new Date('2026-11-15T00:00:00');

      function updateCountdown() {
        const now = new Date();
        const difference = targetDate - now;

        if (difference <= 0) {
          document.getElementById('days').textContent = '0';
          document.getElementById('hours').textContent = '0';
          document.getElementById('minutes').textContent = '0';
          document.getElementById('seconds').textContent = '0';
          return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((difference / (1000 * 60)) % 60);
        const seconds = Math.floor((difference / 1000) % 60);

        document.getElementById('days').textContent = String(days).padStart(2, '0');
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
